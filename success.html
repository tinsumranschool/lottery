<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>ชำระเงินสำเร็จ</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="card" style="text-align: center; margin-top: 50px;">
    <h1 id="status-text">กำลังตรวจสอบการชำระเงิน...</h1>
    <p id="sub-text" class="muted">กรุณารอสักครู่ ระบบกำลังติดต่อกับ Stripe</p>
    <button id="btn-back" class="hidden" onclick="window.location.href='index.html'">กลับสู่หน้าหลัก</button>
  </div>

  <script src="config.js"></script>
  <script>
    async function verifyPayment() {
      const urlParams = new URLSearchParams(window.location.search);
      const sessionId = urlParams.get('session_id');
      
      if (!sessionId) {
        document.getElementById('status-text').textContent = "ไม่พบข้อมูลการชำระเงิน";
        return;
      }

      const session = JSON.parse(localStorage.getItem("session") || "null");
      if (!session) {
        document.getElementById('status-text').textContent = "กรุณาเข้าสู่ระบบก่อน";
        return;
      }

      try {
        const res = await fetch(window.GAS_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "verifyCheckout",
            payload: { sessionId: sessionId, sessionToken: session.sessionToken }
          }),
          redirect: "follow"
        });

        const data = await res.json();

        if (data.ok && data.status === "approved") {
          session.status = "approved";
          localStorage.setItem("session", JSON.stringify(session));

          document.getElementById('status-text').textContent = "✅ ชำระเงินสำเร็จ!";
          document.getElementById('sub-text').textContent = "บัญชีของคุณอัปเกรดเป็น Pro แล้ว";
          document.getElementById('btn-back').classList.remove('hidden');
        } else {
          document.getElementById('status-text').textContent = "❌ ตรวจสอบการชำระเงินไม่สำเร็จ";
          document.getElementById('sub-text').textContent = data.error || "กรุณาติดต่อแอดมิน";
        }
      } catch (err) {
        document.getElementById('status-text').textContent = "เกิดข้อผิดพลาดในการเชื่อมต่อ";
      }
    }

    verifyPayment();
  </script>
</body>
</html>
